<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>בדיחה בלחיצה</title>
  <meta name="description" content="כותבים נושא, לוחצים, וצוחקים.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Playpen+Sans+Hebrew:wght@500&display=swap">
  <style>
    :root {
      --sun: #FFE15A;
      --paper: #FFFFFF;
      --ink: #2B1E4A;
      --ink-soft: #4A3D6B;
      --red: #F23D2F;
      --blue: #2E9BFF;
      --error: #C0261B;
      --error-bg: #FFE8EC;
      --hint: #756B92;
      --ui-font: "Fredoka", system-ui, sans-serif;
      --joke-font: "Playpen Sans Hebrew", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      font-family: var(--ui-font);
      font-weight: 500;
      color: var(--ink);
      background-color: var(--sun);
      background-image: url("assets/bg-doodles.svg"), url("assets/bg-dots.svg");
      background-repeat: no-repeat, repeat;
      background-position: top center, 0 0;
      -webkit-tap-highlight-color: transparent;
    }

    main {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 24px 18px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      display: block;
      width: 300px;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }

    .intro {
      margin: 0;
      text-align: center;
      font-size: 17px;
      font-weight: 500;
      color: var(--ink-soft);
      line-height: 1.4;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 18px;
      font-weight: 600;
    }

    input {
      width: 100%;
      font: 500 19px var(--ui-font);
      color: var(--ink);
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 18px;
      padding: 12px 16px;
      box-shadow: 4px 4px 0 var(--ink);
      transform: rotate(0.6deg);
      outline: none;
    }

    input::placeholder { color: var(--hint); opacity: 1; }

    input:focus-visible { box-shadow: 4px 4px 0 var(--ink), 0 0 0 4px var(--blue); }

    .go {
      width: 100%;
      min-height: 64px;
      margin-bottom: 8px;
      font: 700 24px var(--ui-font);
      color: #fff;
      background: var(--red);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 0 8px 0 var(--ink);
      transform: rotate(-1deg);
      cursor: pointer;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .go:focus-visible { outline: 4px solid var(--blue); outline-offset: 4px; }

    .go:active,
    .go[aria-busy="true"] {
      transform: rotate(-1deg) translateY(6px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .go:disabled { cursor: progress; }

    .bubble {
      position: relative;
      min-height: 190px;
      margin-top: 10px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 28px;
      box-shadow: 6px 6px 0 var(--ink);
      transform: rotate(-1.2deg);
    }

    .mascot {
      display: none;
      width: 118px;
      height: auto;
      transform-origin: 50% 90%;
    }

    .bubble[data-state="idle"] .mascot-idle,
    .bubble[data-state="think"] .mascot-think,
    .bubble[data-state="joke"] .mascot-joke,
    .bubble[data-state="error"] .mascot-error { display: block; }

    .message {
      margin: 0;
      text-align: center;
      font-size: 17px;
      color: var(--ink-soft);
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* Joke: the mascot jumps to the top right corner, half outside */
    .bubble[data-state="joke"] {
      align-items: stretch;
      padding-top: 40px;
    }

    .bubble[data-state="joke"] .mascot {
      position: absolute;
      top: -42px;
      right: 14px;
      width: 86px;
      transform: rotate(8deg);
    }

    .bubble[data-state="joke"] .message {
      text-align: start;
      font-family: var(--joke-font);
      font-size: 25px;
      line-height: 1.55;
      color: var(--ink);
    }

    /* Error */
    .bubble[data-state="error"] { background: var(--error-bg); }

    .bubble[data-state="error"] .message {
      color: var(--error);
      font-weight: 600;
    }

    footer {
      margin-top: auto;
      padding: 28px 18px 18px;
      text-align: center;
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* Motion */
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    @keyframes squish {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.08, 0.86); }
    }

    @keyframes laugh {
      0%, 100% { transform: rotate(8deg); }
      25% { transform: rotate(-6deg) translateY(-3px); }
      75% { transform: rotate(20deg) translateY(-3px); }
    }

    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-9deg); }
      75% { transform: rotate(9deg); }
    }

    .bubble[data-state="idle"] .mascot { animation: bob 2.4s ease-in-out infinite; }
    .bubble[data-state="think"] .mascot { animation: squish 0.5s ease-in-out infinite; }
    .bubble[data-state="joke"] .mascot { animation: laugh 0.45s ease-in-out 4; }
    .bubble[data-state="error"] .mascot { animation: wobble 0.5s ease-in-out 2; }

    @media (prefers-reduced-motion: reduce) {
      .bubble .mascot { animation: none !important; }
      .go { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/logo.svg" alt="בדיחה בלחיצה" width="300" height="158">

    <p class="intro">כותבים נושא, לוחצים, וצוחקים.<br>בלי נושא, מקבלים בדיחה כללית.</p>

    <form id="joke-form" novalidate>
      <div class="field">
        <label for="topic">על מה הבדיחה?</label>
        <input id="topic" name="topic" type="text" maxlength="100" placeholder="למשל: חתולים" autocomplete="off" enterkeyhint="go">
      </div>
      <button class="go" id="go" type="submit">תנו לי בדיחה!</button>
    </form>

    <section class="bubble" id="bubble" data-state="idle">
      <img class="mascot mascot-idle" src="assets/mascot-idle.svg" alt="" width="118" height="110">
      <img class="mascot mascot-think" src="assets/mascot-think.svg" alt="" width="118" height="110">
      <img class="mascot mascot-joke" src="assets/mascot-joke.svg" alt="" width="118" height="110">
      <img class="mascot mascot-error" src="assets/mascot-error.svg" alt="" width="118" height="110">
      <p class="message" id="message" aria-live="polite">לוחצים על הכפתור, והבדיחה מופיעה כאן</p>
    </section>
  </main>

  <footer>מיישם AI ואוטומציה · 53500</footer>

  <script>
    const form = document.getElementById('joke-form');
    const input = document.getElementById('topic');
    const button = document.getElementById('go');
    const bubble = document.getElementById('bubble');
    const message = document.getElementById('message');

    function show(state, text, buttonText) {
      bubble.dataset.state = state;
      message.textContent = text;
      button.textContent = buttonText;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (button.disabled) return;

      const topic = input.value.trim().slice(0, 100);
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      show('think', topic ? `מחפש בדיחה על ${topic}...` : 'מחפש בדיחה...', 'חושב...');

      try {
        const response = await fetch('/api/joke', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ topic }),
        });
        const data = await response.json().catch(() => ({}));

        if (response.ok && typeof data.joke === 'string') {
          show('joke', data.joke, 'עוד בדיחה!');
        } else {
          show('error', data.error || 'משהו השתבש. נסו שוב.', 'לנסות שוב');
        }
      } catch {
        show('error', 'אין חיבור לשרת כרגע. נסו שוב.', 'לנסות שוב');
      } finally {
        button.disabled = false;
        button.removeAttribute('aria-busy');
      }
    });
  </script>
</body>
</html>
